<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - OneClick DataScrape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#00d4c5',
                            hover: '#00b8aa',
                        },
                        dark: {
                            bg: '#0a0f1c',
                            form: '#0f172a',
                            input: '#1e293b',
                            border: '#334155',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center bg-dark-bg text-gray-300 px-4">
    <div class="w-full max-w-md glass-card rounded-2xl p-8 border border-white/10 bg-black/40">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-white mb-2">Set New Password</h2>
            <p class="text-gray-400 text-sm">Choose a strong password for your account.</p>
        </div>

        {% if validlink %}
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label for="id_new_password1" class="block text-xs font-semibold text-gray-500 uppercase mb-2">New Password</label>
                <div class="relative">
                    <input type="password" name="new_password1" id="id_new_password1"
                        class="w-full bg-dark-input border border-dark-border text-white rounded-lg px-4 py-3 pr-12 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors placeholder-gray-600"
                        required>
                    <button type="button" id="toggle_new_pw" data-target="id_new_password1" aria-label="Toggle new password visibility" aria-pressed="false" class="absolute inset-y-0 right-0 flex items-center px-4 text-gray-400 hover:text-gray-200">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <div>
                <label for="id_new_password2" class="block text-xs font-semibold text-gray-500 uppercase mb-2">Confirm Password</label>
                <div class="relative">
                    <input type="password" name="new_password2" id="id_new_password2"
                        class="w-full bg-dark-input border border-dark-border text-white rounded-lg px-4 py-3 pr-12 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors placeholder-gray-600"
                        required>
                    <button type="button" id="toggle_confirm_pw" data-target="id_new_password2" aria-label="Toggle confirm password visibility" aria-pressed="false" class="absolute inset-y-0 right-0 flex items-center px-4 text-gray-400 hover:text-gray-200">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-brand hover:bg-brand-hover text-dark-bg font-bold py-3 px-4 rounded-lg transition-all shadow-[0_0_20px_rgba(0,212,197,0.2)]">
                Update Password
            </button>
        </form>
        {% else %}
        <div class="text-center">
            <p class="text-sm text-gray-400">This reset link is invalid or has expired.</p>
            <a href="{% url 'password_reset' %}" class="inline-block mt-6 text-brand hover:underline font-medium">Request a new link</a>
        </div>
        {% endif %}
    </div>
    <script>
        (function () {
            function wire(btnId) {
                const btn = document.getElementById(btnId);
                if (!btn) return;
                const input = document.getElementById(btn.getAttribute('data-target'));
                if (!input) return;
                const icon = btn.querySelector('i');
                function setState(show) {
                    input.type = show ? 'text' : 'password';
                    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                    if (icon) {
                        icon.classList.toggle('fa-eye', !show);
                        icon.classList.toggle('fa-eye-slash', show);
                        icon.classList.toggle('fa-regular', !show);
                        icon.classList.toggle('fa-solid', show);
                    }
                }
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    setState(input.type !== 'text');
                });
            }
            wire('toggle_new_pw');
            wire('toggle_confirm_pw');
        })();
    </script>
</body>
</html>
